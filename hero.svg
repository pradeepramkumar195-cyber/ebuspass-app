<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a6b"/><stop offset=".45" stop-color="#ffc58a"/><stop offset="1" stop-color="#ffe9c7"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb3c8"/><stop offset="1" stop-color="#16748a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdeff7"/><stop offset="1" stop-color="#7cc3d6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="610" cy="120" r="46" fill="#fff3d6" opacity=".9"/>
  <!-- far buildings -->
  <g fill="#f3a77f" opacity=".7">
    <rect x="20" y="120" width="60" height="180"/><rect x="90" y="80" width="50" height="220"/><rect x="150" y="140" width="70" height="160"/>
    <rect x="460" y="100" width="55" height="200"/><rect x="525" y="150" width="70" height="150"/><rect x="700" y="90" width="60" height="210"/>
  </g>
  <!-- near buildings -->
  <g fill="#7a8fb8">
    <rect x="0" y="170" width="70" height="140"/><rect x="230" y="150" width="80" height="160"/><rect x="620" y="160" width="90" height="150"/><rect x="740" y="130" width="60" height="180"/>
  </g>
  <g fill="#ffe08a" opacity=".85">
    <rect x="12" y="185" width="12" height="14"/><rect x="40" y="185" width="12" height="14"/><rect x="12" y="215" width="12" height="14"/>
    <rect x="245" y="170" width="12" height="14"/><rect x="275" y="170" width="12" height="14"/><rect x="245" y="200" width="12" height="14"/>
    <rect x="640" y="180" width="12" height="14"/><rect x="670" y="180" width="12" height="14"/><rect x="755" y="150" width="12" height="14"/>
  </g>
  <!-- trees -->
  <g><rect x="345" y="245" width="8" height="50" fill="#6b4a2e"/><circle cx="349" cy="235" r="28" fill="#3f9a5a"/>
     <rect x="585" y="250" width="8" height="45" fill="#6b4a2e"/><circle cx="589" cy="240" r="24" fill="#4caf6a"/></g>
  <!-- road -->
  <rect y="300" width="800" height="100" fill="#5b6070"/>
  <rect y="296" width="800" height="8" fill="#c9ccd6"/>
  <g fill="#f5f5f5"><rect x="20" y="350" width="60" height="6" rx="3"/><rect x="140" y="350" width="60" height="6" rx="3"/><rect x="260" y="350" width="60" height="6" rx="3"/><rect x="380" y="350" width="60" height="6" rx="3"/><rect x="500" y="350" width="60" height="6" rx="3"/><rect x="620" y="350" width="60" height="6" rx="3"/><rect x="740" y="350" width="60" height="6" rx="3"/></g>
  <!-- bus stop sign -->
  <rect x="520" y="200" width="6" height="100" fill="#3b3f4a"/>
  <rect x="496" y="180" width="54" height="34" rx="6" fill="#1f6feb"/>
  <text x="523" y="202" font-family="Arial" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BUS</text>
  <!-- people -->
  <g><circle cx="560" cy="248" r="7" fill="#7a4b2a"/><rect x="553" y="256" width="14" height="26" rx="5" fill="#e35d6a"/><rect x="554" y="281" width="5" height="16" fill="#333"/><rect x="561" y="281" width="5" height="16" fill="#333"/></g>
  <g><circle cx="580" cy="252" r="6" fill="#5a3a20"/><rect x="574" y="259" width="12" height="22" rx="4" fill="#3d7dd8"/><rect x="575" y="280" width="4" height="15" fill="#333"/><rect x="581" y="280" width="4" height="15" fill="#333"/></g>
  <!-- BUS -->
  <g transform="translate(60 180)">
    <rect x="0" y="20" width="380" height="110" rx="18" fill="url(#bus)"/>
    <rect x="0" y="20" width="380" height="18" rx="9" fill="#38c6da"/>
    <rect x="16" y="46" width="300" height="44" rx="6" fill="url(#glass)"/>
    <g stroke="#16748a" stroke-width="4"><line x1="76" y1="46" x2="76" y2="90"/><line x1="136" y1="46" x2="136" y2="90"/><line x1="196" y1="46" x2="196" y2="90"/><line x1="256" y1="46" x2="256" y2="90"/></g>
    <g fill="#2c4a5a" opacity=".55"><circle cx="46" cy="66" r="8"/><circle cx="106" cy="64" r="8"/><circle cx="166" cy="66" r="8"/><circle cx="226" cy="64" r="8"/></g>
    <rect x="326" y="46" width="44" height="68" rx="6" fill="url(#glass)"/>
    <rect x="16" y="98" width="300" height="10" rx="5" fill="#ffd166"/>
    <text x="160" y="125" font-family="Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">e-BusPass  •  GUDIVADA ⇄ GUDLAVALLERU</text>
    <rect x="364" y="112" width="14" height="8" rx="3" fill="#fff6b0"/>
    <circle cx="80" cy="132" r="22" fill="#2b2e36"/><circle cx="80" cy="132" r="9" fill="#9aa0ad"/>
    <circle cx="300" cy="132" r="22" fill="#2b2e36"/><circle cx="300" cy="132" r="9" fill="#9aa0ad"/>
  </g>
  <!-- slogan board -->
  <g transform="translate(610 205)">
    <rect width="170" height="70" rx="10" fill="#ffffff" opacity=".93"/>
    <text x="85" y="28" font-family="Arial" font-size="17" font-weight="800" fill="#1d2b4f" text-anchor="middle">NO LINES.</text>
    <text x="85" y="50" font-family="Arial" font-size="17" font-weight="800" fill="#1d2b4f" text-anchor="middle">APPLY ONLINE.</text>
  </g>
